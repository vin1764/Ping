name: Admin

# One-off maintenance tasks that need the repo secrets (see ping/admin.py).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        options: [apply-sql, create-reviewer, build-demo, gemini-check, functions-check, ask-ping-page]
      reviewer_email:
        description: "create-reviewer: the reviewer's sign-in email"
        default: "reviewer@ping-demo.example"
      reviewer_password:
        description: "create-reviewer / functions-check: the reviewer's password"
        default: ""

permissions:
  contents: write   # build-demo saves dashboard/demo-data.json back to the repo

concurrency:
  group: admin
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Hide the typed password from the logs
        # GitHub prints a step's environment before the step runs, so mask it in an earlier step,
        # reading it from the event file (never echoed)
        run: |
          pw=$(jq -r '.inputs.reviewer_password // ""' "$GITHUB_EVENT_PATH")
          [ -n "$pw" ] && echo "::add-mask::$pw" || true
      - run: pip install -q -r requirements.txt
      - name: Install a browser (ask-ping-page only)
        if: inputs.task == 'ask-ping-page'
        run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Run ${{ inputs.task }}
        env:
          TASK: ${{ inputs.task }}
          REVIEWER_EMAIL: ${{ inputs.reviewer_email }}
          REVIEWER_PASSWORD: ${{ inputs.reviewer_password }}
          ERP_USER_ID: ${{ secrets.ERP_USER_ID }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m ping.admin "$TASK"
      - name: Save the demo data
        if: inputs.task == 'build-demo'
        run: |
          git config user.name "ping-admin"
          git config user.email "ping-admin@users.noreply.github.com"
          git add dashboard/demo-data.json
          git diff --cached --quiet && { echo "demo data unchanged"; exit 0; }
          git commit -q -m "Demo data: anonymised snapshot of the real run"
          git push
