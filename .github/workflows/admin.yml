name: Admin

# One-off maintenance tasks that need the repo secrets (see ping/admin.py).
on:
  workflow_dispatch:
    inputs:
      task:
        description: "What to do"
        type: choice
        options: [apply-sql, build-demo, gemini-check, functions-check, ask-ping-page, rearm-schedule, ask-ping-evals, relevance-evals, auth-config, cleanup-demo, demo-clock, demo-refeed, schedule-setup, schedule-status, log-scan]

permissions:
  contents: write   # build-demo saves dashboard/demo-data.json back to the repo
  actions: write    # rearm-schedule switches the Ping workflow off and on

concurrency:
  group: admin
  cancel-in-progress: false

jobs:
  admin:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Install a browser (ask-ping-page only)
        if: inputs.task == 'ask-ping-page'
        run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Run ${{ inputs.task }}
        env:
          TASK: ${{ inputs.task }}
          ERP_USER_ID: ${{ secrets.ERP_USER_ID }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          # log-scan only: the values it searches the logs for (masked by GitHub; never printed by Ping)
          ERP_PASSWORD: ${{ inputs.task == 'log-scan' && secrets.ERP_PASSWORD || '' }}
          ERP_SECQ_1: ${{ inputs.task == 'log-scan' && secrets.ERP_SECQ_1 || '' }}
          ERP_SECQ_2: ${{ inputs.task == 'log-scan' && secrets.ERP_SECQ_2 || '' }}
          ERP_SECQ_3: ${{ inputs.task == 'log-scan' && secrets.ERP_SECQ_3 || '' }}
          MAIL_APP_PASSWORD: ${{ inputs.task == 'log-scan' && secrets.MAIL_APP_PASSWORD || '' }}
          PING_GITHUB_TOKEN: ${{ inputs.task == 'log-scan' && secrets.PING_GITHUB_TOKEN || '' }}
          DASHBOARD_DEPLOY_TOKEN: ${{ inputs.task == 'log-scan' && secrets.DASHBOARD_DEPLOY_TOKEN || '' }}
        run: |
          python -m ping.admin "$TASK"
      - name: Save the demo data
        if: inputs.task == 'build-demo' || inputs.task == 'demo-refeed'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "ping-admin"
          git config user.email "ping-admin@users.noreply.github.com"
          git add dashboard/demo-data.json
          git diff --cached --quiet && { echo "demo data unchanged"; exit 0; }
          git commit -q -m "Demo data: ${{ inputs.task == 'demo-refeed' && 'feed rebuilt (digests, For you) from the same snapshot' || 'anonymised snapshot of the real run' }}"
          git pull -q --rebase && git push
          # a push made with this workflow's token doesn't start other workflows; ask for the dashboard deploy
          gh workflow run dashboard.yml --ref "$GITHUB_REF_NAME" && echo "dashboard deploy started"
      - name: Save the Ask Ping eval report
        if: inputs.task == 'ask-ping-evals' || inputs.task == 'relevance-evals'
        run: |
          git config user.name "ping-admin"
          git config user.email "ping-admin@users.noreply.github.com"
          for f in evals/ask_ping/REPORT.md evals/ask_ping/results.json evals/relevance/REPORT.md; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && { echo "report unchanged"; exit 0; }
          git commit -q -m "${{ inputs.task == 'relevance-evals' && 'Relevance evals' || 'Ask Ping evals' }}: report from the latest run"
          git pull -q --rebase && git push
