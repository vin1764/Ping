name: Dashboard

on:
  push:
    paths: ["dashboard/**", "supabase/**", "ping/sample.py", "ping/items.py", ".github/workflows/dashboard.yml"]
  schedule:
    - cron: "41 21 * * *"   # daily 03:11 IST: rebuild so the demo's dates stay current
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Build the site
        env:
          # The publishable key is meant to be public; Row Level Security protects the data.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          mkdir -p _site && cp -r dashboard/* _site/
          python -m ping.sample _site/demo-data.json
          python - <<'PY'
          import json, os
          cfg = {"supabaseUrl": os.environ.get("SUPABASE_URL", ""), "supabaseKey": os.environ.get("SUPABASE_PUBLISHABLE_KEY", "")}
          open("_site/config.js", "w").write("window.PING_CONFIG = " + json.dumps(cfg) + ";\n")
          PY
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

  functions:
    # Needs a Supabase access token (Supabase > Account > Access Tokens) saved as the
    # repo secret SUPABASE_ACCESS_TOKEN. Skipped until it exists.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "SUPABASE_ACCESS_TOKEN not set yet - skipping the Check now / Ask Ping functions."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_TOKEN == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.HAS_TOKEN == 'true'
        name: Deploy functions and their secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PING_GITHUB_TOKEN: ${{ secrets.PING_GITHUB_TOKEN }}
          PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          PROJECT=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          supabase functions deploy check-now ask-ping --project-ref "$PROJECT" --no-verify-jwt
          ARGS=("PING_GITHUB_REPO=$REPO" "PING_GITHUB_REF=$REF")
          [ -n "$GEMINI_API_KEY" ] && ARGS+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          [ -n "$PING_GITHUB_TOKEN" ] && ARGS+=("PING_GITHUB_TOKEN=$PING_GITHUB_TOKEN")
          [ -n "$PUBLISHABLE" ] && ARGS+=("PING_PUBLISHABLE_KEY=$PUBLISHABLE")
          supabase secrets set --project-ref "$PROJECT" "${ARGS[@]}" > /dev/null
          echo "Functions deployed."
