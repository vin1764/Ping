name: Dashboard

on:
  push:
    paths: ["dashboard/**", "supabase/**", "ping/sample.py", "ping/items.py", "setup/check_public_build.py",
            ".github/workflows/dashboard.yml"]
  workflow_dispatch:

permissions:
  contents: read   # this repo is only read; the public repo is written with DASHBOARD_DEPLOY_TOKEN

concurrency:
  group: dashboard
  cancel-in-progress: true

jobs:
  deploy-pages:
    # Builds the static dashboard and pushes ONLY the built files to the public repo <owner>/ping-dashboard,
    # which GitHub Pages serves at https://<owner>.github.io/ping-dashboard/. This repo stays private.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUBLIC_REPO: ${{ github.repository_owner }}/ping-dashboard
      PAGES_URL: https://${{ github.repository_owner }}.github.io/ping-dashboard/
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Build the site
        env:
          # The publishable key is meant to be public; Row Level Security protects the data.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: bash dashboard/build.sh
      - name: "Guard: nothing private in the built files"
        env:
          ERP_USER_ID: ${{ secrets.ERP_USER_ID }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
        run: python setup/check_public_build.py _site
      - name: Push the built files to the public repo
        env:
          TOKEN: ${{ secrets.DASHBOARD_DEPLOY_TOKEN }}
        run: |
          [ -n "$TOKEN" ] || { echo "::error::DASHBOARD_DEPLOY_TOKEN is not set (see README: Live dashboard)"; exit 1; }
          cd _site
          git init -q -b main
          git config user.name "ping-deploy"
          git config user.email "ping-deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "build ${GITHUB_SHA::7} from private repo"
          # every deploy replaces the whole public history: only the current build is ever public
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${PUBLIC_REPO}.git" main
          echo "pushed build ${GITHUB_SHA::7} to ${PUBLIC_REPO}"
      - name: Switch on GitHub Pages (main, root) and wait until this build is live
        env:
          TOKEN: ${{ secrets.DASHBOARD_DEPLOY_TOKEN }}
        run: |
          api="https://api.github.com/repos/${PUBLIC_REPO}/pages"
          h=(-H "Authorization: Bearer $TOKEN" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          code=$(curl -s -o pages.json -w "%{http_code}" "${h[@]}" "$api")
          if [ "$code" = "404" ]; then
            code=$(curl -s -o out.json -w "%{http_code}" -X POST "${h[@]}" "$api" -d '{"source":{"branch":"main","path":"/"}}')
            echo "Pages switched on: HTTP $code"; [ "$code" = "201" ] || { cat out.json; exit 1; }
          else
            code=$(curl -s -o out.json -w "%{http_code}" -X PUT "${h[@]}" "$api" -d '{"source":{"branch":"main","path":"/"}}')
            echo "Pages source set to main /: HTTP $code"; [ "$code" = "204" ] || { cat out.json; exit 1; }
          fi
          short=${GITHUB_SHA::7}
          for i in $(seq 1 40); do
            sleep 15
            if curl -s "${PAGES_URL}config.js?nocache=$RANDOM" | grep -q "PING_BUILD = \"$short\""; then
              echo "live: ${PAGES_URL} serves build $short"
              for f in index.html app.js style.css demo-data.json; do
                echo "  $f: HTTP $(curl -s -o /dev/null -w '%{http_code}' "${PAGES_URL}$f")"
              done
              exit 0
            fi
            echo "waiting for Pages ($((i*15))s)"
          done
          echo "::error::Pages did not serve build $short within 10 minutes"; exit 1

  deploy-functions:
    # Needs a Supabase access token (Supabase > Account > Access Tokens) saved as the
    # repo secret SUPABASE_ACCESS_TOKEN. Skipped until it exists.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
    steps:
      - if: env.HAS_TOKEN != 'true'
        run: echo "SUPABASE_ACCESS_TOKEN not set yet - skipping the Check now / Ask Ping functions."
      - if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v5
      - if: env.HAS_TOKEN == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - if: env.HAS_TOKEN == 'true'
        name: Deploy functions and their secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PING_GITHUB_TOKEN: ${{ secrets.PING_GITHUB_TOKEN }}
          PUBLISHABLE: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: |
          PROJECT=$(echo "$SUPABASE_URL" | sed -E 's#https://([^.]+)\..*#\1#')
          # --yes: the CLI asks "are you sure?" and GitHub can't answer, so nothing was deployed without it
          supabase functions deploy check-now ask-ping --project-ref "$PROJECT" --no-verify-jwt --yes
          ARGS=("PING_GITHUB_REPO=$REPO" "PING_GITHUB_REF=$REF")
          [ -n "$GEMINI_API_KEY" ] && ARGS+=("GEMINI_API_KEY=$GEMINI_API_KEY")
          [ -n "$PING_GITHUB_TOKEN" ] && ARGS+=("PING_GITHUB_TOKEN=$PING_GITHUB_TOKEN")
          [ -n "$PUBLISHABLE" ] && ARGS+=("PING_PUBLISHABLE_KEY=$PUBLISHABLE")
          supabase secrets set --project-ref "$PROJECT" --yes "${ARGS[@]}" > /dev/null
          # prove it: the function must answer (403 "not allowed" without a login is the right answer)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$SUPABASE_URL/functions/v1/ask-ping")
          echo "ask-ping answers HTTP $code (403 = deployed and checking logins)"
          [ "$code" = "403" ] || { echo "::error::ask-ping isn't answering as expected"; exit 1; }
