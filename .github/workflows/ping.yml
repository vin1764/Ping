name: Ping

on:
  # The hourly run is started by Supabase's own scheduler (pg_cron -> the kick-run function, sql/schedule.sql),
  # because GitHub's cron never fired for this repo. GitHub's cron line stays as a backup; both use the same
  # rule (skip if a run is going or started in the last 50 minutes), so they never start two runs.
  schedule:
    # GitHub's clock is UTC. 00:41-19:41 UTC = every hour from 06:11 to 01:11 IST (20 runs a day).
    - cron: "41 0-19 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [run, check, probe, load-sample, remove-sample, diagnose, recheck, rescan]
        default: run
      source:
        description: "Who started it (kick-run sends 'schedule': it then counts as a scheduled run)"
        type: choice
        options: [manual, schedule]
        default: manual
      company:
        description: "diagnose / recheck: the company to read again from the ERP (read-only)"
        type: string
        default: ""
      run_row:
        description: "Check now: the run's row the dashboard is already showing ('queued'); the run fills it in"
        type: string
        default: ""

concurrency:
  group: ping
  cancel-in-progress: false

permissions:
  contents: read
  actions: read   # the backup cron's guard looks at recent Ping runs

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # a fresh copy of this repository has no secrets yet: the run says so and stops (green), see docs/SETUP.md
      SET_UP: ${{ secrets.ERP_USER_ID != '' && secrets.SUPABASE_URL != '' }}
    steps:
      - name: Not set up yet
        if: env.SET_UP != 'true'
        run: echo "::notice::Ping isn't set up in this repository yet (no ERP_USER_ID / SUPABASE_URL secrets). See docs/SETUP.md."
      - uses: actions/checkout@v5
        if: env.SET_UP == 'true'
      - uses: actions/setup-python@v6
        if: env.SET_UP == 'true'
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
        if: env.SET_UP == 'true'
      - name: "Backup cron only: stand down if Supabase's scheduler already started a run"
        id: guard
        if: env.SET_UP == 'true' && github.event_name == 'schedule'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # to read the student's own schedule (how often, which hours) from the profile
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python -m ping.schedule_guard
      - name: Run Ping
        if: env.SET_UP == 'true' && steps.guard.outputs.skip != 'true'
        env:
          PING_MODE: ${{ inputs.mode || 'run' }}
          # posting in the chat and push (ping/posting.py): "on" once the posting guard's tests pass; anything else
          # holds every new message back (saved, not posted) until it's on again
          PING_POSTING: "on"
          PING_RUN_ROW: ${{ inputs.run_row || '' }}
          PING_COMPANY: ${{ inputs.company || '' }}
          # 'schedule' for GitHub's cron and for kick-run's hourly start, 'manual' for Check now / Run workflow
          PING_TRIGGER: ${{ github.event_name == 'schedule' && 'schedule' || inputs.source || 'manual' }}
          ERP_USER_ID: ${{ secrets.ERP_USER_ID }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          ERP_SECQ_1: ${{ secrets.ERP_SECQ_1 }}
          ERP_SECQ_2: ${{ secrets.ERP_SECQ_2 }}
          ERP_SECQ_3: ${{ secrets.ERP_SECQ_3 }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}  # only used by the 'check' mode
          # AI fallback for notices the rules can't read (Gemini if GEMINI_API_KEY is set; see ping/ai.py)
          PING_AI_PROVIDER: ${{ vars.PING_AI_PROVIDER }}
          PING_AI_BASE_URL: ${{ vars.PING_AI_BASE_URL }}
          PING_AI_MODEL: ${{ vars.PING_AI_MODEL }}
          PING_AI_KEY: ${{ secrets.PING_AI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # the cards' one-line summaries (ping/summaries.py): Groq first, then Gemini flash-lite
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python -m ping.run

