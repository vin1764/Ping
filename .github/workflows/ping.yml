name: Ping

on:
  schedule:
    # GitHub's clock is UTC. 00:41-19:41 UTC = every hour from 06:11 to 01:11 IST (20 runs a day).
    # Minute 41 avoids the top of the hour, when GitHub is busiest and runs get delayed.
    - cron: "41 0-19 * * *"
    # once a day, 02:53 IST: delete one-click demo sessions older than 7 days (the cleanup-demo job below)
    - cron: "23 21 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        options: [run, check, probe, load-sample, remove-sample]
        default: run

concurrency:
  group: ping
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    if: github.event.schedule != '23 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Run Ping
        env:
          PING_MODE: ${{ inputs.mode || 'run' }}
          ERP_USER_ID: ${{ secrets.ERP_USER_ID }}
          ERP_PASSWORD: ${{ secrets.ERP_PASSWORD }}
          ERP_SECQ_1: ${{ secrets.ERP_SECQ_1 }}
          ERP_SECQ_2: ${{ secrets.ERP_SECQ_2 }}
          ERP_SECQ_3: ${{ secrets.ERP_SECQ_3 }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}  # only used by the 'check' mode
          # AI fallback for notices the rules can't read (Gemini if GEMINI_API_KEY is set; see ping/ai.py)
          PING_AI_PROVIDER: ${{ vars.PING_AI_PROVIDER }}
          PING_AI_BASE_URL: ${{ vars.PING_AI_BASE_URL }}
          PING_AI_MODEL: ${{ vars.PING_AI_MODEL }}
          PING_AI_KEY: ${{ secrets.PING_AI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python -m ping.run

  cleanup-demo:
    # anonymous demo users and their chat messages older than 7 days (sql: cleanup_demo_sessions)
    if: github.event.schedule == '23 21 * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Delete week-old demo sessions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          MAIL_ADDRESS: ${{ secrets.MAIL_ADDRESS }}
        run: python -m ping.admin cleanup-demo
