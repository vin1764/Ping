name: Tests

on:
  push:
    paths: ["ping/**", "tests/**", "requirements*.txt", "dashboard/**", "supabase/functions/**", "evals/ask_ping/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements-dev.txt
      - run: python -m pytest -q
      # the mailbox as a source on the 20-mail fixture mailbox (evals/mail/REPORT.md)
      - run: python evals/mail/run_mail_evals.py
      # the page's and Ask Ping's shared JS (rules, router, Today, live updates, onboarding, names)
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: node --test tests/js/*.test.js
      # Ask Ping's router on every eval case and conversation, offline (FACT answers must pass with no model)
      - run: node evals/ask_ping/route_offline.js | tail -1
      # the Supabase functions' own tests
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: cd supabase/functions && deno test -A ask-ping _shared/pages_test.ts
