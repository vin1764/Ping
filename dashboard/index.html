<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Ping</title>
  <meta name="description" content="Your IIT KGP placement updates, only the ones that are about you.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230e6b5c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
  <script>try { const t = JSON.parse(localStorage.getItem("ping-theme")); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
</head>
<body>
  <header class="top">
    <a class="brand" href="#chat"><span class="avatar" aria-hidden="true">P</span>
      <span><strong>Ping</strong><span id="subtitle" class="sub">placement updates</span></span></a>
    <span id="mode-badge" class="badge" hidden></span>
  </header>
  <div id="status" class="status" role="status" hidden></div>
  <main id="app"><p class="muted center">Loading…</p></main>
  <!-- phones: a bottom bar; desktop: a slim left rail (same links, plus Check now and the theme) -->
  <nav id="nav" class="nav" aria-label="Main" hidden>
    <a href="#chat" data-route="chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Chat<span id="nav-unread" class="dot" hidden></span></a>
    <a href="#companies" data-route="companies"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V8l6-3v15M10 20V10l10 2v8M3 20h18M14 15h2M14 18h2"/></svg>Companies</a>
    <a href="#profile" data-route="profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Profile</a>
    <span class="rail-gap rail-only"></span>
    <button id="check-now" class="nav-btn rail-only" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Check now</button>
    <button id="theme-btn" class="nav-btn rail-only" type="button" aria-label="Theme: follows the system"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9,9,0,1,0,9,9,7,7,0,0,1-9-9z"/></svg><span class="theme-label">Theme</span></button>
  </nav>

  <dialog id="modal"><div id="modal-body"></div><form method="dialog"><button class="btn ghost">Close</button></form></dialog>
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title"></dialog>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="onboarding.js"></script>
  <script src="names.js"></script>
  <script src="app.js"></script>
</body>
</html>
