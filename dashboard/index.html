<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <title>Ping</title>
  <meta name="description" content="Your IIT KGP placement updates, only the ones that are about you.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23157a5c'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#chat"><span class="avatar" aria-hidden="true">P</span>
      <span><strong>Ping</strong><span id="subtitle" class="sub">placement updates</span></span></a>
    <span id="mode-badge" class="badge" hidden></span>
    <button id="menu-btn" class="icon-btn" aria-expanded="false" aria-controls="menu" hidden>Menu</button>
    <nav id="menu" class="menu" hidden>
      <a href="#chat" data-route="chat">Chat</a>
      <a href="#feed" data-route="feed">All updates</a>
      <a href="#companies" data-route="companies">Companies</a>
      <a href="#profile" data-route="profile">Profile</a>
      <button id="check-now" type="button">Check now</button>
      <button id="sign-out" type="button" hidden>Sign out</button>
    </nav>
  </header>
  <div id="status" class="status" hidden></div>
  <main id="app"><p class="muted center">Loading…</p></main>

  <dialog id="modal"><div id="modal-body"></div><form method="dialog"><button class="btn ghost">Close</button></form></dialog>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="onboarding.js"></script>
  <script src="app.js"></script>
</body>
</html>
