<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ping</title>
  <meta name="description" content="Your IIT KGP placement updates, only the ones that are about you.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%232f6fed'/%3E%3Ccircle cx='16' cy='16' r='5' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#feed"><span class="dot"></span>Ping</a>
    <nav id="nav" hidden>
      <a href="#feed" data-route="feed">For you</a>
      <a href="#companies" data-route="companies">Companies</a>
      <a href="#profile" data-route="profile">Profile</a>
    </nav>
    <div class="top-right">
      <span id="mode-badge" class="badge" hidden></span>
      <button id="check-now" class="btn" hidden>Check now</button>
      <button id="sign-out" class="btn ghost" hidden>Sign out</button>
    </div>
  </header>
  <div id="status" class="status" hidden></div>
  <main id="app"><p class="muted center">Loading…</p></main>

  <aside id="ask" class="ask" hidden>
    <button id="ask-toggle" class="ask-toggle" aria-expanded="false">Ask Ping</button>
    <div id="ask-panel" class="ask-panel" hidden>
      <div id="ask-log" class="ask-log" aria-live="polite"></div>
      <form id="ask-form" class="ask-form">
        <input id="ask-input" autocomplete="off" placeholder="What's due tomorrow?" maxlength="300">
        <button class="btn">Ask</button>
      </form>
    </div>
  </aside>

  <dialog id="modal"><div id="modal-body"></div><form method="dialog"><button class="btn ghost">Close</button></form></dialog>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
